[project]
name = "lectern-speech"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
    "numpy==2.2.6",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
cpu = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.6.0",
    "pyannote.audio==4.0.1",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
]
cuda = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.6.0",
    "pyannote.audio==4.0.1",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
]
ui = ["gradio>=5,<6"]
metrics = ["jiwer>=3,<5"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "httpx==0.28.1"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchcodec = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
