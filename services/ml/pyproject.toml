[project]
name = "lectern-ml"
version = "0.1.0"
description = "LEctern material generation service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "groq>=0.30,<1.0",
  "google-genai==1.75.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "boto3>=1.34,<2.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.uv]
package = false
required-version = ">=0.13.6,<0.14"
