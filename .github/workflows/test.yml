name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make test
      - run: docker compose --profile local --profile materials config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml --profile local config --quiet
      - run: docker compose build web ml
      - run: make demo
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose --profile local --profile materials logs --tail=100
