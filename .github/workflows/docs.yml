name: Documentation
on:
  push:
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'README.md', 'Makefile', 'maintenance/diagrams/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'README.md', 'Makefile', 'maintenance/diagrams/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: make docs-build
      - uses: actions/upload-artifact@v4
        with:
          name: lectern-docs
          path: site/
