name: Documentation
on:
  push:
    paths: ['docs/**', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.python-version', 'README.md', 'Makefile', 'maintenance/diagrams/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', '.python-version', 'README.md', 'Makefile', 'maintenance/diagrams/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: make docs-build
      - uses: actions/upload-artifact@v4
        with:
          name: lectern-docs
          path: site/
