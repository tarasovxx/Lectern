services:
  web:
    environment:
      TRANSCRIPTION_BACKEND: local
      GENERATE_MATERIALS: 'true'
    depends_on:
      speech:
        condition: service_healthy
      ml:
        condition: service_started
  ml:
    environment:
      TRANSCRIBER_TYPE: local
      LLM_TYPE: local
      LOCAL_LLM_URL: http://ollama:11434/v1
    depends_on:
      ollama-init:
        condition: service_completed_successfully
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: '0'
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  ollama-init:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
    entrypoint: [/bin/sh]
    command:
      - -ec
      - 'ollama show "$${LOCAL_LLM_MODEL}" >/dev/null 2>&1 || ollama pull "$${LOCAL_LLM_MODEL}"'
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'
volumes:
  ollama-data:
